site_name: AWP Mechanical Handbook

theme:
  name: material
  logo: /assets/awp-logo.png
  favicon: /assets/awp-logo.png
  features:
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom    
      accent: custom
    - scheme: slate       
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - styles/extra.css   # load our CSS overrides
  - stylesheets/interpolator.css

extra_javascript:
  - javascripts/interpolator.js

nav:
  - Home: index.md
  - Conversions: standards/conversions.md
  - Equations: standards/equations.md
  - Laws: 
    - standards/powerlaws.md
    - standards/fanlaws.md
    - standards/pumplaws.md
  - Air Design:
    - standards/ductwork_rules.md
    - standards/air_diffusers.md
    - standards/cooling_load.md
    - standards/engineeringdrawings.md
    - standards/ductworkabbreviations.md
    - standards/ductsystemresistance.md
    - standards/ductfittingcoefficients.md
    - standards/filter_data.md
    - standards/grilledata.md
    - standards/floorareaperoccupant.md
    - standards/exhaustairrequirements.md
    - standards/pyschometricchart.md
    - standards/duct_calculator.md
  - Water Design:
    - Pump Curves:
      - standards/pump_curves_understanding.md
      - standards/pump_curves_selection.md
    - standards/pressure.md
    - standards/pipe_friction_chart.md
    - standards/pipeidentificationcolourchart.md
    - standards/pipeworkbendlengths.md  
  - Fire Resistance Levels: standards/fireresistancelevels.md
  - Extracts from BCA Section J:
    - standards/max_pressure.md
    - standards/climate.md
    - standards/pipeinsulation.md
  - Typicals:
    - standards/typical_details.md

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: false